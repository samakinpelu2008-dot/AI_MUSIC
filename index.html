<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Match</title>
<style>
body{margin:0;font-family:sans-serif;background:#0b8f2f;color:#fff;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;box-sizing:border-box;}
.card{background:#1e1e2f;width:100%;max-width:700px;border-radius:20px;padding:25px;box-shadow:0 15px 35px rgba(0,0,0,0.5);}
.team-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.team{text-align:center;flex:1;}
.team img{width:80px;height:80px;border-radius:50%;border:3px solid #fff;margin-bottom:10px;}
.team h2{margin:0;font-size:22px;}
.score{font-size:48px;font-weight:bold;color:#00ffcc;margin-top:5px;}
.vs{font-size:32px;font-weight:700;color:#ffdd00;margin:0 10px;}
.info-box{background: rgba(255,255,255,0.1); padding:15px; border-radius:12px; margin-bottom:20px;}
.goal-box{background: rgba(255,255,255,0.1); padding:12px; border-radius:12px; margin-bottom:15px;}
.commentary{background: rgba(255,255,255,0.1); border-radius:12px; padding:12px; max-height:150px; overflow-y:auto; margin-bottom:15px;}
.fan-section{background: rgba(255,255,255,0.05); border-radius:12px; padding:12px; margin-bottom:20px;}
.fan-section input{width:70%; padding:6px; border-radius:8px; border:none; margin-right:5px;}
.fan-section button{padding:6px 10px; border-radius:8px; border:none; cursor:pointer; background:#ffdd00; color:#000;}
#fanComments p { background: rgba(255,255,255,0.1); padding:8px; border-radius:8px; margin:4px 0; }
.admin-btn{background:#ffdd00;color:#000;border:none;padding:8px 15px;border-radius:12px;cursor:pointer;margin-bottom:10px;}
#adminPanel{display:none;margin-top:10px;background: rgba(255,255,255,0.15); padding:10px; border-radius:12px;}
#adminPanel input, #adminPanel select, #adminPanel button{margin:5px 0;padding:6px;border-radius:8px;border:none;}
#timer{ font-size:28px; font-weight:700; text-align:center; margin-bottom:10px; color: #00ff00; text-shadow:0 0 8px #00ff00;}
.floatingHeart {position:absolute;font-size:24px;animation: floatUp 2.0s ease-out forwards;pointer-events:none;z-index:9999;}
@keyframes floatUp {0% { opacity:1; transform: translateY(0) scale(1); } 100% { opacity:0; transform: translateY(-500px) scale(1.5); }}
#loveButton{ position:fixed; bottom:30px; right:30px; font-size:40px; cursor:pointer; user-select:none; }
#watchLiveBtn{margin-top:10px;padding:8px 12px;border-radius:8px;border:none;background:#ffdd00;color:#000;cursor:pointer;}
</style>
</head>
<body>

<div class="card">
  <div id="timer">0</div>

  <div class="team-row">
    <div class="team">
      <img src="https://i.ibb.co/B5Rh4FLS/IMG-20251213-102545.jpg" alt="IMPACT FC Logo">
      <h2>IMPACT FC</h2>
    </div>
    <div class="vs" id="vsDisplay">VS</div>
    <div class="team">
      <img src="https://i.ibb.co/ZR2JGNvc/IMG-20251213-102622.jpg" alt="WINNERS FC Logo">
      <h2>WINNERS FC</h2>
    </div>
  </div>

  <div class="info-box">
    <p><strong>Competition:</strong> Baptist Football Tournament '25</p>
    <p><strong>Stage:</strong> Final</p>
    <p><strong>Venue:</strong> Baptist Academy Field, Obanikoro</p>
    <p><strong>Time:</strong> 4 PM</p>
    <p><strong>Date:</strong> 14th December</p>
  </div>

  <div class="goal-box">
    <h3>Goal Scorers</h3>
    <div id="goals">None yet</div>
  </div>

  <div class="commentary">
    <h3>Live Updates</h3>
    <div id="liveComments"></div>
  </div>

  <div class="fan-section">
    <h3>Fan Comments ❤️</h3>
    <input type="text" id="fanComment" placeholder="Write your comment..." />
    <button onclick="addFanComment()">Send</button>
    <div id="fanComments"></div>
  </div>

  <button class="admin-btn" id="adminBtn">Show Admin Controls</button>
  <div id="adminPanel">
    <label>Stage:</label>
    <select id="stageSelect">
      <option value="PRE">Pre-match</option>
      <option value="FH">First Half</option>
      <option value="HT">Half-time</option>
      <option value="SH">Second Half</option>
      <option value="FT">Full-time</option>
    </select>
    <button onclick="changeStage()">Update Stage</button><br>

    <label>IMPACT FC Score:</label><input type="number" id="cpeScore" min="0">
    <button onclick="setScore('CPE')">Update</button><br>

    <label>WINNERS FC Score:</label><input type="number" id="frmScore" min="0">
    <button onclick="setScore('FRM')">Update</button><br>

    <label>Goal Scorer:</label><input type="text" id="goalPlayer">
    <button onclick="addGoal()">Add Goal</button>
    <button onclick="deleteAllGoals()">Delete All Goals</button><br>

    <label>Commentary:</label><input type="text" id="commentText">
    <button onclick="addCommentary()">Add Comment</button>
    <button onclick="deleteAllComments()">Delete All Comments</button><br>

    <label>Watch Live Link:</label><input type="text" id="liveLinkInput">
    <button onclick="updateLiveLink()">Update</button><br>

    <label>Match Duration (minutes):</label>
    <input type="number" id="matchDurationInput" min="1" value="30">
    <button onclick="updateMatchDuration()">Update Duration</button>
    <button onclick="startTimer()">Start Timer</button>
    <button onclick="resetTimer()">Reset Timer</button>
  </div>

  <button id="watchLiveBtn">Watch Live</button>
</div>

<div id="loveButton">💚</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2AScPQkOE632znM9vvCahijtnronS3jU",
  authDomain: "fresherscuplive.firebaseapp.com",
  databaseURL: "https://fresherscuplive-default-rtdb.firebaseio.com",
  projectId: "fresherscuplive",
  storageBucket: "fresherscuplive.firebasestorage.app",
  messagingSenderId: "502451588704",
  appId: "1:502451588704:web:56bd4d7fc98814cddfbd05"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const matchRef = database.ref("match");
const fanRef = database.ref("fanComments");
const loveRef = database.ref("loveCount");
const loveActionsRef = database.ref("loveActions");
const liveLinkRef = database.ref("liveLink");
const timerRef = database.ref("timer");

const adminPassword="CPE2025";
document.getElementById("adminBtn").addEventListener("click",()=>{
  let pass=prompt("Enter admin password:");
  if(pass===adminPassword) document.getElementById("adminPanel").style.display="block";
  else alert("Wrong password!");
});

// Hearts
function spawnHeart(x,y){
  const heart=document.createElement("div");
  heart.className="floatingHeart";
  heart.textContent="💚";
  heart.style.left=Math.max(8,Math.min(window.innerWidth-32,x-12))+"px";
  heart.style.top=Math.max(8,Math.min(window.innerHeight-32,y-12))+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),1500);
}
document.getElementById("loveButton").addEventListener("click",e=>{
  spawnHeart(e.clientX,e.clientY);
  loveActionsRef.push({x:e.clientX,y:e.clientY,time:Date.now()});
  loveRef.transaction(current=>{return (current||0)+1;});
});
loveActionsRef.on("child_added",snapshot=>{
  spawnHeart(Math.random()*(window.innerWidth-80)+40,window.innerHeight-120);
});

// Fan Comments
fanRef.on("value",snapshot=>{
  const data=snapshot.val()||[];
  const fanDiv=document.getElementById("fanComments");
  fanDiv.innerHTML="";
  data.forEach(c=>{
    const p=document.createElement("p");
    p.textContent=c;
    fanDiv.appendChild(p);
  });
});
function addFanComment(){
  const text=document.getElementById("fanComment").value.trim();
  if(!text) return;
  fanRef.once("value").then(s=>{
    let arr=s.val()||[];
    arr.push(text);
    fanRef.set(arr);
  });
  document.getElementById("fanComment").value="";
}

// Match controls
matchRef.on("value",snapshot=>{
  const data=snapshot.val()||{};
  document.getElementById("vsDisplay").textContent=(data.stage=="PRE")?"VS":`${data.scoreCPE||0}-${data.scoreFRM||0}`;
  const goalDiv=document.getElementById("goals");
  goalDiv.innerHTML="";
  if(data.goalScorers && data.goalScorers.length) data.goalScorers.forEach(g=>{const p=document.createElement("p");p.textContent=g;goalDiv.appendChild(p);});
  else goalDiv.textContent="None yet";
});
function changeStage() {
  const stage = document.getElementById("stageSelect").value;
  const now = Date.now();
  let updates = { stage: stage };

  if(stage === "FH" || stage === "SH"){
    updates.startTime = now;
    updates.running = true;
    if(stage === "SH"){ updates.startTime = now - 30*60000; }
  } else if(stage === "HT" || stage === "FT"){
    updates.running = false;
  }

  matchRef.update(updates);
}

function setScore(team){
  const val=(team=="CPE")?Number(document.getElementById("cpeScore").value):Number(document.getElementById("frmScore").value);
  if(team=="CPE") matchRef.update({scoreCPE:val}); else matchRef.update({scoreFRM:val});
}
function addGoal(){const player=document.getElementById("goalPlayer").value.trim(); if(!player) return; matchRef.child("goalScorers").once("value").then(s=>{let arr=s.val()||[]; arr.push(player); matchRef.update({goalScorers:arr});}); document.getElementById("goalPlayer").value="";}
function deleteAllGoals(){matchRef.update({goalScorers:[]});}
function addCommentary(){const text=document.getElementById("commentText").value.trim(); if(!text) return; matchRef.child("liveComments").once("value").then(s=>{let arr=s.val()||[]; arr.push(text); matchRef.update({liveComments:arr});}); document.getElementById("commentText").value="";}
function deleteAllComments(){matchRef.update({liveComments:[]});}

// Watch live
document.getElementById("watchLiveBtn").addEventListener("click",()=>{
  liveLinkRef.once("value").then(s=>{
    const link=s.val()||"";
    if(link) window.open(link,"_blank");
    else alert("Live unavailable");
  });
});
function updateLiveLink(){
  const link=document.getElementById("liveLinkInput").value.trim();
  if(link) liveLinkRef.set(link);
  document.getElementById("liveLinkInput").value="";
}

// Timer
let timerInterval = null;
matchRef.on("value", snapshot => {
  const data = snapshot.val() || {};
  const stage = data.stage || "PRE";
  const startTime = data.startTime || Date.now();
  const duration = data.duration || 30;
  const running = data.running || false;

  if(stage === "PRE"){
    document.getElementById("timer").textContent = "0";
    clearInterval(timerInterval);
    document.getElementById("vsDisplay").textContent = "VS";
  } else if(stage === "FH" || stage === "SH"){
    document.getElementById("vsDisplay").textContent = `${data.scoreCPE||0}-${data.scoreFRM||0}`;
    if(running){ startLiveTimer(startTime,duration); }
  } else if(stage === "HT"){
    document.getElementById("timer").textContent = "HALF-TIME";
    clearInterval(timerInterval);
  } else if(stage === "FT"){
    document.getElementById("timer").textContent = "FULL-TIME";
    clearInterval(timerInterval);
  }
});

function updateMatchDuration(){
  const duration = Number(document.getElementById("matchDurationInput").value);
  if(duration>0) matchRef.update({duration:duration});
}

function startTimer(){
  matchRef.once("value").then(s=>{
    const data=s.val()||{};
    const duration = data.duration || 30;
    const startTime = Date.now();
    matchRef.update({startTime:startTime, running:true, stage:"FH"});
    startLiveTimer(startTime,duration);
  });
}

function resetTimer(){
  matchRef.update({running:false});
  clearInterval(timerInterval);
  document.getElementById("timer").textContent="0";
}

function startLiveTimer(startTime,duration){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const now = Date.now();
    let elapsed = Math.floor((now - startTime)/60000);
    if(elapsed>=duration){ elapsed=duration; clearInterval(timerInterval); matchRef.update({running:false}); }
    document.getElementById("timer").textContent = elapsed;
  },1000);
}
</script>
</body>
</html>
