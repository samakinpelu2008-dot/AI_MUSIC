<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Baptist Football Tournament '25 – IMPACT FC vs WINNERS FC</title>
<style>
body{
  margin:0; font-family:sans-serif; background:#0b8f2f; color:#fff; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:20px; box-sizing:border-box;
}
.card{
  background:#1e1e2f; width:100%; max-width:700px; border-radius:20px; padding:25px; box-shadow:0 15px 35px rgba(0,0,0,0.5);
}
.team-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.team{text-align:center; flex:1;}
.team img{width:80px; height:80px; border-radius:50%; border:3px solid #fff; margin-bottom:10px;}
.team h2{margin:0; font-size:22px;}
.score-container{display:flex; justify-content:center; align-items:center; font-size:36px; font-weight:bold; color:#00ffcc; margin-top:5px; gap:20px;}
.info-box{background: rgba(255,255,255,0.1); padding:15px; border-radius:12px; margin-bottom:20px;}
.goal-box{background: rgba(255,255,255,0.1); padding:12px; border-radius:12px; margin-bottom:15px;}
.commentary{background: rgba(255,255,255,0.1); border-radius:12px; padding:12px; max-height:150px; overflow-y:auto; margin-bottom:15px;}
.fan-section{background: rgba(255,255,255,0.05); border-radius:12px; padding:12px; margin-bottom:20px;}
.fan-section input{width:70%; padding:6px; border-radius:8px; border:none; margin-right:5px;}
.fan-section button{padding:6px 10px; border-radius:8px; border:none; cursor:pointer; background:#ffdd00; color:#000;}
#fanComments p { background: rgba(255,255,255,0.1); padding:8px; border-radius:8px; margin:4px 0; display:flex; justify-content:space-between; align-items:center;}
.deleteBtn{ margin-left:10px; color:red; cursor:pointer; font-weight:bold;}
.admin-btn{background:#ffdd00;color:#000;border:none;padding:8px 15px;border-radius:12px;cursor:pointer;margin-bottom:10px;}
#adminPanel{display:none;margin-top:10px;background: rgba(255,255,255,0.15); padding:10px; border-radius:12px;}
#adminPanel input, #adminPanel select, #adminPanel button{margin:5px 0;padding:6px;border-radius:8px;border:none;}
#timer{ font-size:28px; font-weight:700; text-align:center; margin-bottom:10px; color: #00ff00; text-shadow:0 0 8px #00ff00;}
#liveBar{height:6px; width:20%; background:#00ff00; border-radius:3px;margin:0 auto 10px auto; display:none;animation: liveMove 3s infinite ease-in-out;}
@keyframes liveMove{0% { transform: translateX(-100%) scaleX(0.5); opacity: 0; }25% { transform: translateX(0%) scaleX(1); opacity: 1; }50% { transform: translateX(100%) scaleX(0.5); opacity: 0; }75% { transform: translateX(0%) scaleX(1); opacity: 1; }100% { transform: translateX(-100%) scaleX(0.5); opacity: 0; }}
.floatingHeart { position:absolute; font-size:24px; animation: floatUp 2.0s ease-out forwards; pointer-events:none; z-index:9999; color:#ff4444; }
@keyframes floatUp { 0% { opacity:1; transform: translateY(0) scale(1); } 100% { opacity:0; transform: translateY(-500px) scale(1.5); } }
#loveButton{ position:fixed; bottom:30px; right:30px; font-size:40px; cursor:pointer; user-select:none; }
#likeCount{position:fixed; bottom:90px; right:40px; font-size:24px; font-weight:bold; color:#ff4444;}
#watchLiveBtn{margin:15px 0; display:block; padding:8px 15px; background:#ffdd00; color:#000; font-weight:bold; border:none; border-radius:12px; cursor:pointer; text-align:center;}
</style>
</head>
<body>

<div class="card">
  <div id="liveBar"></div>
  <div id="timer">0</div>

  <div class="team-row">
    <div class="team">
      <img src="https://i.ibb.co/B5Rh4FLS/IMG-20251213-102545.jpg" alt="IMPACT FC Logo">
      <h2>IMPACT FC</h2>
    </div>
    <div class="score-container" id="scoreDisplay">
      <span id="scoreIMPACT">0</span> - <span id="scoreWINNERS">0</span>
    </div>
    <div class="team">
      <img src="https://i.ibb.co/ZR2JGNvc/IMG-20251213-102622.jpg" alt="WINNERS FC Logo">
      <h2>WINNERS FC</h2>
    </div>
  </div>

  <div class="info-box">
    <p><strong>Competition:</strong> Baptist Football Tournament '25</p>
    <p><strong>Stage:</strong> Final</p>
    <p><strong>Venue:</strong> Baptist Academy Field, Obanikoro</p>
    <p><strong>Date:</strong> 14th December</p>
    <p><strong>Time:</strong> 4 PM</p>
  </div>

  <button id="watchLiveBtn" onclick="watchLive()">Watch Live</button>
  <div id="likeCount">0 Likes</div>

  <div class="goal-box">
    <h3>Goal Scorers</h3>
    <div id="goals">None yet</div>
  </div>

  <div class="commentary">
    <h3>Live Updates</h3>
    <div id="liveComments"></div>
  </div>

  <div class="fan-section">
    <h3>Fan Comments ❤️</h3>
    <input type="text" id="fanName" placeholder="Your name..." />
    <input type="text" id="fanComment" placeholder="Write your comment..." />
    <button onclick="addFanComment()">Send</button>
    <div id="fanComments"></div>
  </div>

  <button class="admin-btn" id="adminBtn">Show Admin Controls</button>
  <div id="adminPanel">
    <label>Stage:</label>
    <select id="stageSelect">
      <option value="PRE">Pre-match</option>
      <option value="FH">First Half</option>
      <option value="HT">Half-time</option>
      <option value="SH">Second Half</option>
      <option value="FT">Full-time</option>
    </select>
    <button onclick="changeStage()">Update Stage</button><br>

    <label>Half Duration (minutes):</label>
    <input type="number" id="halfDuration" value="30">
    <button onclick="updateDuration()">Update Duration</button><br>

    <label>IMPACT FC Score:</label><input type="number" id="impactScore" min="0">
    <button onclick="setScore('IMPACT')">Update</button><br>

    <label>WINNERS FC Score:</label><input type="number" id="winnersScore" min="0">
    <button onclick="setScore('WINNERS')">Update</button><br>

    <label>Goal Scorer:</label><input type="text" id="goalPlayer">
    <button onclick="addGoal()">Add Goal</button>
    <button onclick="deleteAllGoals()">Delete All Goals</button><br>

    <label>Commentary:</label><input type="text" id="commentText">
    <button onclick="addCommentary()">Add Comment</button>
    <button onclick="deleteAllComments()">Delete All Comments</button><br>

    <label>Watch Live Link:</label><input type="text" id="liveLink">
    <button onclick="updateLiveLink()">Update Link</button>
  </div>
</div>

<div id="loveButton">💚</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2AScPQkOE632znM9vvCahijtnronS3jU",
  authDomain: "fresherscuplive.firebaseapp.com",
  databaseURL: "https://fresherscuplive-default-rtdb.firebaseio.com",
  projectId: "fresherscuplive",
  storageBucket: "fresherscuplive.appspot.com",
  messagingSenderId: "502451588704",
  appId: "1:502451588704:web:56bd4d7fc98814cddfbd05"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const adminPassword = "CPE2025";
document.getElementById("adminBtn").addEventListener("click", ()=>{
  let pass = prompt("Enter admin password:");
  if(pass === adminPassword){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("adminBtn").style.display="none";
  } else alert("Wrong password!");
});

const matchRef = db.ref("match");
const fanRef = db.ref("fanComments");
const liveRef = db.ref("liveLink");
const loveRef = db.ref("loveCount");
const loveActionsRef = db.ref("loveActions");

let timerInterval=null;
let halfDuration=30;

// Match listener
matchRef.on("value", snapshot=>{
  const data = snapshot.val()||{};
  document.getElementById("scoreIMPACT").textContent=data.scoreIMPACT||0;
  document.getElementById("scoreWINNERS").textContent=data.scoreWINNERS||0;

  const goalsDiv=document.getElementById("goals");
  goalsDiv.innerHTML="";
  if(data.goalScorers && data.goalScorers.length){
    data.goalScorers.forEach((g,i)=>{
      const p=document.createElement("p");
      p.textContent=g;
      goalsDiv.appendChild(p);
    });
  } else goalsDiv.textContent="None yet";

  const liveDiv=document.getElementById("liveComments");
  liveDiv.innerHTML="";
  if(data.liveComments && data.liveComments.length){
    data.liveComments.forEach(c=>{
      const p=document.createElement("p");
      p.textContent=c;
      liveDiv.appendChild(p);
    });
  }

  document.getElementById("liveBar").style.display=(["FH","SH"].includes(data.stage))?"block":"none";

  if(data.stage=="FH"||data.stage=="SH"){
    if(data.startTime) startLiveTimer(data.startTime,data.stage);
  } else if(data.stage=="HT"){ document.getElementById("timer").textContent="HALF-TIME"; clearInterval(timerInterval);}
  else if(data.stage=="FT"){ document.getElementById("timer").textContent="FULL-TIME"; clearInterval(timerInterval);}
});

// Fan comments listener
fanRef.on("value", snapshot=>{
  const data = snapshot.val()||[];
  const fanDiv = document.getElementById("fanComments");
  fanDiv.innerHTML="";
  data.forEach((c,i)=>{
    const p = document.createElement("p");
    p.textContent=c.text;
    // Delete button for user (if name matches)
    if(c.user==localStorage.getItem("fanName") || adminPassword){
      const btn = document.createElement("span");
      btn.textContent="❌";
      btn.className="deleteBtn";
      btn.onclick=()=>deleteFanComment(i);
      p.appendChild(btn);
    }
    fanDiv.appendChild(p);
  });
});

// Functions
function changeStage(){ const stage=document.getElementById("stageSelect").value; if(stage=="FH"||stage=="SH") matchRef.update({stage,startTime:Date.now()}); else matchRef.update({stage}); }
function setScore(team){ const val=(team=="IMPACT")? Number(document.getElementById("impactScore").value) : Number(document.getElementById("winnersScore").value); if(team=="IMPACT") matchRef.update({scoreIMPACT:val}); else matchRef.update({scoreWINNERS:val}); }
function addGoal(){ const player=document.getElementById("goalPlayer").value.trim(); if(!player) return; matchRef.child("goalScorers").once("value").then(s=>{ let arr=s.val()||[]; arr.push(player); matchRef.update({goalScorers:arr}); }); document.getElementById("goalPlayer").value=""; }
function deleteAllGoals(){ matchRef.update({goalScorers:[]}); }
function addCommentary(){ const text=document.getElementById("commentText").value.trim(); if(!text) return; matchRef.child("liveComments").once("value").then(s=>{ let arr=s.val()||[]; arr.push(text); matchRef.update({liveComments:arr}); }); document.getElementById("commentText").value=""; }
function deleteAllComments(){ matchRef.update({liveComments:[]}); }

function addFanComment(){
  const name=document.getElementById("fanName").value.trim();
  const text=document.getElementById("fanComment").value.trim();
  if(!name||!text) return alert("Enter name and comment");
  localStorage.setItem("fanName",name);
  fanRef.once("value").then(s=>{
    let arr=s.val()||[];
    arr.push({user:name,text:text});
    fanRef.set(arr);
  });
  document.getElementById("fanComment").value="";
}

function deleteFanComment(i){
  fanRef.once("value").then(s=>{
    let arr=s.val()||[];
    arr.splice(i,1);
    fanRef.set(arr);
  });
}

// Timer
function startLiveTimer(startTime,stage){ if(timerInterval) clearInterval(timerInterval); timerInterval=setInterval(()=>{ let elapsed=Math.floor((Date.now()-startTime)/60000); let display=""; if(stage=="FH") display=(elapsed<=halfDuration)? elapsed.toString() : `${halfDuration}+${elapsed-halfDuration}`; else if(stage=="SH"){ elapsed+=halfDuration; display=(elapsed<=halfDuration*2)? elapsed.toString() : `${halfDuration*2}+${elapsed-halfDuration*2}`;} document.getElementById("timer").textContent=display; },1000);}
function updateDuration(){ halfDuration=Number(document.getElementById("halfDuration").value); alert("Half duration updated to "+halfDuration+" minutes"); }
function updateLiveLink(){ const link=document.getElementById("liveLink").value.trim(); liveRef.set(link); alert("Live link updated"); }
function watchLive(){ liveRef.once("value").then(s=>{ const lnk=s.val(); if(lnk) window.open(lnk,"_blank"); else alert("Live unavailable"); }); }

// Heart Likes
function spawnHeart(x,y){ const heart=document.createElement("div"); heart.className="floatingHeart"; heart.textContent="💚"; const left=Math.max(8,Math.min(window.innerWidth-32,x-12)); const top=Math.max(8,Math.min(window.innerHeight-32,y-12)); heart.style.left=left+"px"; heart.style.top=top+"px"; document.body.appendChild(heart); setTimeout(()=>heart.remove(),1500); }
document.getElementById("loveButton").addEventListener("click", e=>{
  spawnHeart(e.clientX,e.clientY);
  loveActionsRef.push({time:Date.now()});
  loveRef.transaction(current=> (current||0)+1 );
});
loveActionsRef.on("child_added", snapshot=>{
  const randomX = Math.random()*(window.innerWidth-80)+40;
  const baseY = window.innerHeight-120;
  spawnHeart(randomX,baseY);
});
loveRef.on("value", snapshot=>{
  const count = snapshot.val()||0;
  document.getElementById("likeCount").textContent = count+" Likes";
});
</script>
</body>
  </html>
